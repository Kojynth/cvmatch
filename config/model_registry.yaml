hardware_tiers:
  cpu_minimal:
    label: "CPU minimal"
    min_vram_gb: 0
    min_ram_gb: 1.5
    default_model: "qwen2-0.5b"
    fallback_models: ["qwen2-1.5b", "qwen2-0.5b"]
  cpu_basic:
    label: "CPU leger"
    min_vram_gb: 0
    min_ram_gb: 4
    default_model: "qwen2-1.5b"
    fallback_models: ["qwen2-0.5b", "qwen2-3b"]
  cpu_power:
    label: "CPU avance"
    min_vram_gb: 0
    min_ram_gb: 12
    default_model: "qwen2-3b"
    fallback_models: ["qwen2-1.5b", "qwen2-0.5b"]
  gpu_entry:
    label: "GPU 4-6GB"
    min_vram_gb: 4
    default_model: "qwen2-3b"
    fallback_models: ["qwen2-1.5b", "qwen2-0.5b"]
  gpu_mid:
    label: "GPU 8-12GB"
    min_vram_gb: 8
    default_model: "qwen2-7b"
    fallback_models: ["qwen3-8b", "mistral-7b", "qwen2-3b", "qwen2-1.5b"]
  gpu_high:
    label: "GPU 16GB+"
    min_vram_gb: 16
    default_model: "qwen2-7b"
    fallback_models: ["qwen3-8b", "ministral-8b", "mistral-7b", "qwen2-3b"]
  gpu_extreme:
