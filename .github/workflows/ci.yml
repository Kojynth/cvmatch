name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pydantic sqlmodel keyring jinja2
      - name: Repo hygiene
        run: python scripts/diagnostics/check_repo_hygiene.py
      - name: Syntax validation
        run: python scripts/validate_syntax.py --critical-only
      - name: Contract tests
        run: python scripts/tests/run_contract_suite.py
