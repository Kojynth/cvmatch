name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pydantic sqlmodel keyring
      - name: Syntax validation
        run: python scripts/validate_syntax.py --critical-only
      - name: Repo hygiene
        run: python scripts/diagnostics/check_repo_hygiene.py
      - name: Contract and mass-apply tests
        run: python -m pytest tests/contracts tests/mass_apply -q
